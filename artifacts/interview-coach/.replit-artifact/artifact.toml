kind = "web"
previewPath = "/"
title = "AI Job Interview Coach"
version = "1.0.0"
id = "artifacts/interview-coach"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25252

[services.development]
run = "pnpm --filter @workspace/interview-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/interview-coach", "run", "build" ]
serve = "static"
publicDir = "artifacts/interview-coach/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25252"
BASE_PATH = "/"
